
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

    <div class="weather-container">

        <!-- Header -->
        <header class="header">
            <h1>🌤 Weather App</h1>
            <p>Real-time weather updates</p>
        </header>

        <!-- Search Section -->
        <section class="search-section">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button id="searchBtn">
                Search
            </button>

        </section>

        <!-- Current Weather -->
        <main class="weather-card" id="weatherCard">

            <div class="location">
                <h2 id="cityName">Search for a city</h2>
                <p id="date">--</p>
            </div>

            <div class="temperature-section">

                <div class="weather-icon" id="weatherIcon">
                    🌤
                </div>

                <h1 id="temperature">--°C</h1>

                <p id="weatherDescription">
                    Weather condition
                </p>

            </div>

            <!-- Weather Details -->
            <div class="weather-details">

                <div class="detail">
                    <span>🌡️</span>
                    <h3 id="feelsLike">--°C</h3>
                    <p>Feels Like</p>
                </div>

                <div class="detail">
                    <span>💧</span>
                    <h3 id="humidity">--%</h3>
                    <p>Humidity</p>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <h3 id="windSpeed">-- km/h</h3>
                    <p>Wind Speed</p>
                </div>

            </div>

        </main>

        <!-- 5 Day Forecast -->
        <section class="forecast-section">

            <h2>5-Day Weather Forecast</h2>

            <div class="forecast-container" id="forecastContainer">

                <p>Search for a city to see the forecast.</p>

            </div>

        </section>

        <!-- Footer -->
        <footer>
            <p>Weather App | Powered by Open-Meteo API</p>
        </footer>
        
    </div>

</body>
</html>
